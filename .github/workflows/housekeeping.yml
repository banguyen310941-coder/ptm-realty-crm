name: CRM Housekeeping

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: crm-housekeeping
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ptm-crm-housekeeping")"
          token="$(printf '%s' "$token_json" | jq -r '.value // empty')"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run CRM housekeeping
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 2 \
            --retry-delay 2 \
            --max-time 40 \
            -H 'User-Agent: ptm-crm-housekeeping/2.0' \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            https://ptm-realty-crm.vercel.app/api/automation/cron)"
          echo "$response"
