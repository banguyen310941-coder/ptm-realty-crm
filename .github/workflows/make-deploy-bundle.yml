name: Make Deploy Bundle

on:
  push:
    branches: [deploy-bundle-f9a86fc]

permissions:
  contents: write

jobs:
  bundle:
    if: ${{ !contains(github.event.head_commit.message, '[bundle-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build production source bundle
        run: |
          tar -czf deploy-bundle.tgz \
            app/page.js \
            app/layout.js \
            app/enterprise.css \
            app/customer-form.css \
            app/customer-wave.css \
            app/finance.css \
            app/inventory-wave2.css \
            app/cemetery.css \
            components/full-crm-app.js \
            components/attendance-launcher.js \
            components/lead-offer-alert.js \
            components/crm-suite \
            lib/crm-client.js \
            lib/rbac.js \
            package.json \
            jsconfig.json \
            next.config.mjs \
            vercel.json
          base64 -w 0 deploy-bundle.tgz > deploy-bundle.b64
          rm deploy-bundle.tgz

      - name: Commit bundle to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-bundle.b64
          git commit -m "chore: [bundle-generated] production source f9a86fc"
          git push
